version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docupilot-db
    environment:
      POSTGRES_USER: docupilot
      POSTGRES_PASSWORD: docupilot_secret_password
      POSTGRES_DB: docupilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docupilot -d docupilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docupilot-backend
    environment:
      PORT: 8080
      DATABASE_URL: postgres://docupilot:docupilot_secret_password@db:5432/docupilot?sslmode=disable
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docupilot-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
