# Render Blueprint Specification for DocuPilot
# Complete 1-click deployment for PostgreSQL (pgvector), Go Backend, and React Frontend
# Docs: https://render.com/docs/blueprint-spec

services:
  # DocuPilot Go + Gin Backend Web Service
  - type: web
    name: docupilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docupilot-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: JWT_SECRET
        generateValue: true

  # DocuPilot React Frontend Static Site
  - type: web
    name: docupilot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: docupilot-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # PostgreSQL with pgvector support
  - name: docupilot-db
    databaseName: docupilot
    user: docupilot
    plan: free
    region: oregon
